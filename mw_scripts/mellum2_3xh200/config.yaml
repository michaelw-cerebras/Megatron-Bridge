    # Ultra-FineWeb; to replace nemotron medium quality + crawl++: 2.867 + 1.433 + 1.4
    /workspace/ml-olympus/codesign_pretrain/tokenized/mellum2/Ultra-FineWeb/ultrafineweb_en_v1_4/data: 2.867
    /workspace/ml-olympus/codesign_pretrain/tokenized/mellum2/Ultra-FineWeb/ultrafineweb_l1_en_hq/data: 1.433
    /workspace/ml-olympus/codesign_pretrain/tokenized/mellum2/Ultra-FineWeb/ultrafineweb_zh/data: 1.4


    # finepdfs
    /workspace/ml-olympus/codesign_pretrain/tokenized/mellum2/finepdfs/data: 4.9

    # peS2o
    /workspace/ml-olympus/codesign_pretrain/tokenized/mellum2/peS2o/data: 0.53

    # pubmed
    /workspace/ml-olympus/codesign_pretrain/tokenized/mellum2/pubmed/data: 0.53

    # stack-v3-train
    /workspace/ml-olympus/codesign_pretrain/tokenized/mellum2/stack-v3-train/data: 14.0

    # uspto
    /workspace/ml-olympus/codesign_pretrain/tokenized/mellum2/uspto/data: 0.53

wandb:
  enabled: true
  base_url: https://cerebras.wandb.io
  entity: team-inferenceml
  project: draft_pretrain
  run_name: mellum2_thinking_first_run_50B_1007
  # API keys must come from the environment or container-side wandb login, never YAML.

run:
  directory: /workspace/ml-olympus/codesign_pretrain/runs/mellum2_thinking_first_run_50B_1007
  save_interval: 1000
  keep_last_checkpoints: 3
  log_interval: 10
  resume_checkpoint: /workspace/ml-olympus/codesign_pretrain/runs/mellum2_thinking_first_run_50B_1007/checkpoints

  # Optional absolute optimizer-step limit for a short smoke; LR horizon stays unchanged.
  exit_interval: null
