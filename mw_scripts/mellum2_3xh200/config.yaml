# Example mixture: independently editable weights for each leaf shard directory.
# Edit these weights and the token budget before a production run.
# Node selection belongs to launch.sh / MELLUM_NODES (default: two nodes, 16 GPUs).
# GBS=192 and EP=8 work unchanged on both 16 and 24 GPUs.
schema_version: 1

model:
  hf_path: JetBrains/Mellum2-12B-A2.5B-Thinking
  architecture: original

train:
  train_tokens: 50000000000
  sequence_length: 8192
  micro_batch_size: 1
  global_batch_size: 192
  seed: 1234

optimizer:
  lr: 0.00003
  min_lr: 0.000003
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 0.00000001
  clip_grad: 1.0

scheduler:
  lr_decay_style: cosine
  lr_warmup_iters: 1000

parallelism:
  tensor_model_parallel_size: 1
  pipeline_model_parallel_size: 1
  context_parallel_size: 1
  expert_model_parallel_size: 8
  expert_tensor_parallel_size: 1

dataset:
  eod_id: 0  # Base tokenizer's document boundary; Thinking generation EOS is 28.
  num_workers: 2
  # Convergence experiment: accept unverified absence of renamed Base IDs 27-32.
  # Use strict for a full bin scan. All mapping/checksum/bin/idx checks remain enabled.
  reserved_token_check: skip

  subsets:
    # One weight per directory directly containing .bin/.idx files (including /data).
    # Weights apply to leaf directories, not to the previous top-level dataset families.
    # Only completed shards with .idx are selected; orphan .bin files are ignored.
    # Never modify selected shards while preparing or training.

    # Nemotron-CC-Code-v1
    /workspace/ml-olympus/codesign_pretrain/tokenized/mellum2/Nemotron-CC-Code-v1/data: 2.1

    # Nemotron-CC-Math-v1
    /workspace/ml-olympus/codesign_pretrain/tokenized/mellum2/Nemotron-CC-Math-v1/3/data: 1.3
    /workspace/ml-olympus/codesign_pretrain/tokenized/mellum2/Nemotron-CC-Math-v1/4plus/data: 2.9
    /workspace/ml-olympus/codesign_pretrain/tokenized/mellum2/Nemotron-CC-Math-v1/4plus_MIND/data: 1.7

    # Nemotron-CC-v2
    /workspace/ml-olympus/codesign_pretrain/tokenized/mellum2/Nemotron-CC-v2/Diverse-QA/data: 2.5
    /workspace/ml-olympus/codesign_pretrain/tokenized/mellum2/Nemotron-CC-v2/High-Quality-Synthetic/data: 7.5
    /workspace/ml-olympus/codesign_pretrain/tokenized/mellum2/Nemotron-CC-v2/High-Quality/data: 2.2
    /workspace/ml-olympus/codesign_pretrain/tokenized/mellum2/Nemotron-CC-v2/Medium-High-Quality/data: 1.9
    /workspace/ml-olympus/codesign_pretrain/tokenized/mellum2/Nemotron-CC-v2/Translated-Diverse-QA/data: 1.0

    # Nemotron-CC-v2.1
    /workspace/ml-olympus/codesign_pretrain/tokenized/mellum2/Nemotron-CC-v2.1/High-Quality-Synthetic/data: 14.9
    /workspace/ml-olympus/codesign_pretrain/tokenized/mellum2/Nemotron-CC-v2.1/High-Quality-Translated-To-English-Synthetic/data: 0.5
    /workspace/ml-olympus/codesign_pretrain/tokenized/mellum2/Nemotron-CC-v2.1/High-Quality-Translated-To-English/data: 0.5
    /workspace/ml-olympus/codesign_pretrain/tokenized/mellum2/Nemotron-CC-v2.1/High-Quality/data: 4.3
    /workspace/ml-olympus/codesign_pretrain/tokenized/mellum2/Nemotron-CC-v2.1/Medium-High-Quality-Synthetic/data: 10.3
    /workspace/ml-olympus/codesign_pretrain/tokenized/mellum2/Nemotron-CC-v2.1/Medium-High-Quality-Translated-To-English/data: 0.5
    /workspace/ml-olympus/codesign_pretrain/tokenized/mellum2/Nemotron-CC-v2.1/Medium-High-Quality/data: 3.8

    # Nemotron-Pretraining-Legal-v1; used in nemotron phase 2 only; use for residual
    /workspace/ml-olympus/codesign_pretrain/tokenized/mellum2/Nemotron-Pretraining-Legal-v1/data: 0.11

    # Nemotron-Pretraining-Specialized-v1
    /workspace/ml-olympus/codesign_pretrain/tokenized/mellum2/Nemotron-Pretraining-Specialized-v1/Nemotron-Pretraining-Math-Textbooks/data: 0.5
    /workspace/ml-olympus/codesign_pretrain/tokenized/mellum2/Nemotron-Pretraining-Specialized-v1/Nemotron-Pretraining-STEM-SFT/data: 9.2
